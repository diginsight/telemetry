<!-- Diginsight theme switcher: runtime Bootswatch swap, About-menu integration -->
<style>
  .ds-swatch {
    display: inline-block;
    width: 28px;
    height: 16px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: middle;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15);
    flex-shrink: 0;
  }
  .ds-swatch > span {
    display: block;
    width: 100%;
    height: 5px;
  }
  .ds-theme-item {
    display: flex;
    align-items: center;
    line-height: 1.2;
  }
  .ds-theme-item .ds-mode-badge {
    margin-left: auto;
    font-size: 0.7em;
    opacity: 0.6;
    padding-left: 8px;
    text-transform: uppercase;
  }
  /* Nested submenu support (Bootstrap 5 doesn't ship one) */
  .dropdown-submenu { position: relative; }
  .dropdown-submenu > .dropdown-toggle::after {
    content: "\25B8";
    border: none;
    float: right;
    margin-top: 2px;
    margin-left: 8px;
    vertical-align: 0;
  }
  .dropdown-submenu > .ds-submenu {
    display: none;
    position: absolute;
    top: 0;
    left: 100%;
    margin-top: -1px;
    max-height: 70vh;
    overflow-y: auto;
    min-width: 240px;
    z-index: 1100;
  }
  .dropdown-submenu.show > .ds-submenu { display: block; }
  @media (max-width: 767.98px) {
    .dropdown-submenu > .ds-submenu {
      position: static;
      box-shadow: none;
      border: none;
      padding-left: 1rem;
      max-height: none;
    }
  }
</style>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "diginsight.theme";
  var CDN = "https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/";
  var LINK_ID = "diginsight-theme-css";
  var OVERRIDE_STYLE_ID = "diginsight-theme-overrides";
  // Diginsight customizations that must be neutralised so a predefined theme
  // renders in its original (pristine Bootswatch) form.
  var CUSTOM_CSS_RE = /(^|\/)(styles|styles-callouts)\.css([?#]|$)/;

  // name, mode, primary, body bg, body fg, border, font, pair (sibling in opposite mode)
  var THEMES = [
    { n: "cerulean",  m: "light", p: "#2fa4e7", bg: "#ffffff", fg: "#495057", br: "#dee2e6", f: "Segoe UI",        pair: "superhero" },
    { n: "cosmo",     m: "light", p: "#2780e3", bg: "#ffffff", fg: "#373a3c", br: "#dee2e6", f: "Source Sans Pro", pair: "darkly"    },
    { n: "flatly",    m: "light", p: "#2c3e50", bg: "#ffffff", fg: "#7b8a8b", br: "#ecf0f1", f: "Lato",            pair: "darkly"    },
    { n: "journal",   m: "light", p: "#eb6864", bg: "#ffffff", fg: "#222222", br: "#dddddd", f: "News Cycle",      pair: "darkly"    },
    { n: "litera",    m: "light", p: "#4582ec", bg: "#ffffff", fg: "#343a40", br: "#e9ecef", f: "Source Sans Pro", pair: "slate"     },
    { n: "lumen",     m: "light", p: "#158cba", bg: "#ffffff", fg: "#555555", br: "#e7e7e7", f: "Source Sans Pro", pair: "cyborg"    },
    { n: "lux",       m: "light", p: "#1a1a1a", bg: "#ffffff", fg: "#55595c", br: "#dee2e6", f: "Nunito Sans",     pair: "darkly"    },
    { n: "materia",   m: "light", p: "#2196f3", bg: "#ffffff", fg: "#444444", br: "#dfdfdf", f: "Roboto",          pair: "vapor"     },
    { n: "minty",     m: "light", p: "#78c2ad", bg: "#ffffff", fg: "#5a5a5a", br: "#dee2e6", f: "Montserrat",      pair: "solar"     },
    { n: "morph",     m: "light", p: "#378dfc", bg: "#eef1f6", fg: "#828a99", br: "#d6dbe7", f: "Nunito",          pair: "cyborg"    },
    { n: "pulse",     m: "light", p: "#593196", bg: "#ffffff", fg: "#444444", br: "#e9ecef", f: "Source Sans Pro", pair: "quartz"    },
    { n: "sandstone", m: "light", p: "#325d88", bg: "#ffffff", fg: "#3e3f3a", br: "#dfd7ca", f: "Roboto",          pair: "solar"     },
    { n: "simplex",   m: "light", p: "#d9230f", bg: "#ffffff", fg: "#444444", br: "#dee2e6", f: "Open Sans",       pair: "darkly"    },
    { n: "sketchy",   m: "light", p: "#333333", bg: "#ffffff", fg: "#555555", br: "#dee2e6", f: "Neucha",          pair: "darkly"    },
    { n: "spacelab",  m: "light", p: "#446e9b", bg: "#ffffff", fg: "#3e3f3a", br: "#dee2e6", f: "Source Sans Pro", pair: "slate"     },
    { n: "united",    m: "light", p: "#e95420", bg: "#ffffff", fg: "#333333", br: "#dee2e6", f: "Ubuntu",          pair: "darkly"    },
    { n: "yeti",      m: "light", p: "#008cba", bg: "#ffffff", fg: "#222222", br: "#dee2e6", f: "Open Sans",       pair: "superhero" },
    { n: "zephyr",    m: "light", p: "#3459e6", bg: "#ffffff", fg: "#495057", br: "#dee2e6", f: "Inter",           pair: "slate"     },
    { n: "cyborg",    m: "dark",  p: "#2a9fd6", bg: "#060606", fg: "#adafae", br: "#222222", f: "Roboto",          pair: "lumen"     },
    { n: "darkly",    m: "dark",  p: "#375a7f", bg: "#222222", fg: "#ffffff", br: "#444444", f: "Lato",            pair: "flatly"    },
    { n: "quartz",    m: "dark",  p: "#a531fc", bg: "#1a1a40", fg: "#ffffff", br: "#9d6cff", f: "Inter",           pair: "pulse"     },
    { n: "slate",     m: "dark",  p: "#3a3f44", bg: "#272b30", fg: "#aaaaaa", br: "#1c1e22", f: "Roboto",          pair: "spacelab"  },
    { n: "solar",     m: "dark",  p: "#b58900", bg: "#002b36", fg: "#839496", br: "#073642", f: "Source Sans Pro", pair: "sandstone" },
    { n: "superhero", m: "dark",  p: "#df6919", bg: "#2b3e50", fg: "#ebebeb", br: "#4e5d6c", f: "Lato",            pair: "yeti"      },
    { n: "vapor",     m: "dark",  p: "#a51c8a", bg: "#1a0933", fg: "#ffffff", br: "#32177a", f: "Inter",           pair: "materia"   }
  ];

  var THEME_INDEX = THEMES.reduce(function (acc, t) { acc[t.n] = t; return acc; }, {});

  function read() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function write(name) {
    try {
      if (name) localStorage.setItem(STORAGE_KEY, name);
      else localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* private mode etc. */ }
  }

  function applyTheme(name) {
    var existing = document.getElementById(LINK_ID);
    if (!name) {
      if (existing) existing.remove();
      setDiginsightCustomizations(true);
      setThemeOverrides(null);
      applyMenuTheme(null);
      return;
    }
    if (!THEME_INDEX[name]) return;
    var t = THEME_INDEX[name];
    var href = CDN + name + "/bootstrap.min.css";
    if (existing) {
      if (existing.getAttribute("href") !== href) existing.setAttribute("href", href);
    } else {
      var link = document.createElement("link");
      link.id = LINK_ID;
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    }
    // Apply the predefined theme in its original form: turn off Diginsight's
    // custom stylesheets and neutralise the SCSS-baked navbar/banner colors.
    setDiginsightCustomizations(false);
    setThemeOverrides(t);
    applyMenuTheme(t.m);
  }

  // The Quarto navbar carries data-bs-theme="dark" so its links read white on the
  // colored bar. In Bootstrap 5.3 the dropdown menus inherit that dark scope, so a
  // predefined Bootswatch theme turns them black. Scope each navbar dropdown menu
  // to the selected theme's own mode (light => white menu, dark => dark menu).
  // Pass null to clear the override and restore Quarto's default behaviour.
  function applyMenuTheme(mode) {
    var menus = document.querySelectorAll(".navbar .dropdown-menu");
    for (var i = 0; i < menus.length; i++) {
      if (mode) menus[i].setAttribute("data-bs-theme", mode);
      else menus[i].removeAttribute("data-bs-theme");
    }
  }

  // Toggle the custom Diginsight CSS files (styles.css / styles-callouts.css)
  // that are loaded at the end of <body>. Disabled => predefined theme is pristine.
  function setDiginsightCustomizations(enabled) {
    var links = document.getElementsByTagName("link");
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute("href") || "";
      if (CUSTOM_CSS_RE.test(href)) {
        links[i].disabled = !enabled;
        links[i].media = enabled ? "all" : "not all";
      }
    }
  }

  // Override the SCSS-baked customizations (orange navbar, yellow .alert-primary
  // banner) that live inside Quarto's compiled bundle and therefore cannot be
  // unloaded. Reset them to the selected theme's own colors. Pass null to clear.
  function setThemeOverrides(t) {
    var styleEl = document.getElementById(OVERRIDE_STYLE_ID);
    if (!t) {
      if (styleEl) styleEl.remove();
      return;
    }
    if (!styleEl) {
      styleEl = document.createElement("style");
      styleEl.id = OVERRIDE_STYLE_ID;
      document.head.appendChild(styleEl);
    }
    styleEl.textContent =
      ".navbar{background-color:" + t.p + " !important;}" +
      ".alert-primary{" +
        "background-color:var(--bs-primary-bg-subtle) !important;" +
        "color:var(--bs-primary-text-emphasis) !important;" +
        "border-color:var(--bs-primary-border-subtle) !important;" +
      "}";
  }

  // Apply ASAP to minimise FOUC (head script — body may not exist yet).
  // The custom CSS links live at the end of <body>, so they are re-toggled
  // from whenReady() once the DOM is fully parsed.
  applyTheme(read());

  function swatchHtml(t) {
    return '<span class="ds-swatch" style="background:' + t.bg + ';border:1px solid ' + t.br + ';">'
         +   '<span style="background:' + t.p + ';"></span>'
         + '</span>';
  }
  function tooltipFor(t) {
    return t.n + " (" + t.m + ")\n"
         + "primary: " + t.p + "\n"
         + "bg: " + t.bg + "  fg: " + t.fg + "\n"
         + "border: " + t.br + "\n"
         + "font: " + t.f;
  }

  function buildSubmenu() {
    var ul = document.createElement("ul");
    ul.className = "dropdown-menu ds-submenu";
    THEMES.forEach(function (t) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "dropdown-item ds-theme-item";
      a.href = "#";
      a.title = tooltipFor(t);
      a.setAttribute("data-theme", t.n);
      a.innerHTML = swatchHtml(t)
        + '<span>' + t.n + '</span>'
        + '<span class="ds-mode-badge">' + t.m + '</span>';
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        write(t.n);
        applyTheme(t.n);
        markActive(t.n);
      });
      li.appendChild(a);
      ul.appendChild(li);
    });
    return ul;
  }

  function markActive(name) {
    document.querySelectorAll(".ds-theme-item").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-theme") === name);
    });
  }

  function findAboutMenu() {
    var toggles = document.querySelectorAll(".navbar .nav-item.dropdown > .nav-link.dropdown-toggle");
    for (var i = 0; i < toggles.length; i++) {
      if ((toggles[i].textContent || "").trim().toLowerCase() === "about") {
        return toggles[i].parentElement.querySelector(".dropdown-menu");
      }
    }
    return null;
  }

  function toggleMode() {
    var current = read();
    var t = current ? THEME_INDEX[current] : null;
    var next = t && THEME_INDEX[t.pair] ? t.pair : (t && t.m === "dark" ? "cosmo" : "darkly");
    write(next);
    applyTheme(next);
    markActive(next);
  }

  function resetTheme() {
    write(null);
    applyTheme(null);
    markActive(null);
  }

  function injectMenu() {
    var menu = findAboutMenu();
    if (!menu || menu.querySelector(".dropdown-submenu[data-ds-theme-root]")) return false;

    var divider = document.createElement("li");
    divider.innerHTML = '<hr class="dropdown-divider">';
    menu.appendChild(divider);

    var themeLi = document.createElement("li");
    themeLi.className = "dropdown-submenu";
    themeLi.setAttribute("data-ds-theme-root", "");
    var themeLink = document.createElement("a");
    themeLink.className = "dropdown-item dropdown-toggle";
    themeLink.href = "#";
    themeLink.textContent = "Theme";
    themeLink.title = "Pick a Bootswatch theme (applied immediately, saved to this browser)";
    themeLink.addEventListener("click", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      themeLi.classList.toggle("show");
    });
    themeLi.appendChild(themeLink);
    themeLi.appendChild(buildSubmenu());
    menu.appendChild(themeLi);

    var toggleLi = document.createElement("li");
    var toggleA = document.createElement("a");
    toggleA.className = "dropdown-item";
    toggleA.href = "#";
    toggleA.textContent = "Toggle light / dark";
    toggleA.title = "Swap to the dark or light sibling of the current theme";
    toggleA.addEventListener("click", function (ev) { ev.preventDefault(); toggleMode(); });
    toggleLi.appendChild(toggleA);
    menu.appendChild(toggleLi);

    var resetLi = document.createElement("li");
    var resetA = document.createElement("a");
    resetA.className = "dropdown-item";
    resetA.href = "#";
    resetA.textContent = "Reset theme";
    resetA.title = "Clear the saved theme and use the site default";
    resetA.addEventListener("click", function (ev) { ev.preventDefault(); resetTheme(); });
    resetLi.appendChild(resetA);
    menu.appendChild(resetLi);

    markActive(read());
    return true;
  }

  document.addEventListener("click", function (ev) {
    document.querySelectorAll(".dropdown-submenu.show").forEach(function (el) {
      if (!el.contains(ev.target)) el.classList.remove("show");
    });
  });

  function whenReady() {
    // Re-apply now that <body> (and the custom CSS links at its end) are parsed,
    // so a saved theme correctly disables the Diginsight customizations.
    applyTheme(read());
    if (injectMenu()) return;
    var obs = new MutationObserver(function () { if (injectMenu()) obs.disconnect(); });
    obs.observe(document.body, { childList: true, subtree: true });
    setTimeout(function () { obs.disconnect(); }, 10000);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", whenReady);
  } else {
    whenReady();
  }
})();
</script>
