name: Diginsight v3+ NuGet Packages

on:
  push:
    tags:
      - v1*
      - '!v1.*'
      - v2*
      - '!v2.*'
      - v3*
      - v4*
      - v5*
      - v6*
      - v7*
      - v8*
      - v9*

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: pwsh

env:
  SOLUTION_SLN: src/Diginsight.slnx
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |-
            8.x
            9.x
            10.x
            11.x

      - name: Restore
        run: |
          dotnet restore $env:SOLUTION_SLN --locked-mode -f -v minimal

      - name: Build
        run: |
          dotnet build $env:SOLUTION_SLN --no-restore -c Release -v minimal "-p:Version=$("${env:GITHUB_REF_NAME}".Substring(1))"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet Packages
        run: |
          Get-ChildItem Diginsight.*.nupkg -Recurse | ForEach-Object { dotnet nuget push $_.FullName -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate }
